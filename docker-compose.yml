services:
  # Podverse Web Application with Svenska Learning
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # API Configuration
      - API_PROTOCOL=https
      - API_PORT=443
      - API_PATH=api
      - API_VERSION=v1
      - API_DOMAIN=api.podverse.fm
      - WEB_DOMAIN=localhost:3000
      - PUBLIC_API_PROTOCOL=https
      - PUBLIC_API_DOMAIN=api.podverse.fm
      - PUBLIC_WEB_PROTOCOL=http
      - PUBLIC_WEB_DOMAIN=localhost:3000
      # Svenska Learning - AI Providers
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=https://api.deepseek.com
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_API_URL=https://api.moonshot.cn/v1
      # Local Whisper
      - WHISPER_LOCAL_URL=http://whisper:8080
      - WHISPER_MODEL=large-v3
    depends_on:
      - whisper
    restart: unless-stopped

  # Local Whisper Transcription Server
  whisper:
    build:
      context: ./whisper-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - WHISPER_MODEL=large-v3
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_PORT=8080
    volumes:
      # Cache the Whisper model to avoid re-downloading
      - whisper-cache:/root/.cache/huggingface
    restart: unless-stopped
    # GPU support (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  whisper-cache:
